[project]
name = "feature-store"
version = "0.1.0"
description = "Isolated Feast feature store for trading-bot feature experimentation (pandas<3, siloed from main project's pandas 3.x env)"
authors = [
    {name = "Michael Eko"}
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "feast[postgres] (==0.64.0)",
    "pandas (>=2.2,<3)",
    "pyarrow (>=17.0.0,<19.0.0)",
    "grpcio (>=1.82.1,<2.0.0)",
    "grpcio-health-checking (>=1.82.1,<2.0.0)",
    "grpcio-reflection (>=1.82.1,<2.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
