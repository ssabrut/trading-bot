[project]
name = "trading-bot"
version = "0.1.0"
description = "GBPUSD Intraday ML/RL Trading System (MT5 bridge, LightGBM, PPO RL agent)"
authors = [
    {name = "Michael Eko"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "lightgbm (>=4.6.0,<5.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "gymnasium (>=1.3.0,<2.0.0)",
    "stable-baselines3 (>=2.9.0,<3.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "pyarrow (>=19.0.0,<20.0.0)",
    "dukascopy-python (>=4.0.1,<5.0.0)",
    "metatrader5 (>=5.0.5735,<6.0.0) ; sys_platform == \"win32\"",
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mlflow-skinny (>=3.0.0,<4.0.0)",
    "boto3 (>=1.35.0,<2.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
